[project]
name = "churn"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Moaz Essam", email = "262887845+moazessam376-dev@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "joblib>=1.6.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
churn = "churn:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
