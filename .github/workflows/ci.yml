name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Train CI model
        run: uv run churn-train --data data/telco_churn.csv --out models --version ci
      - name: Run tests
        run: uv run pytest -q
